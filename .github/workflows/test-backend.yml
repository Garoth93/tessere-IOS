name: test-backend

# Tests of the Cloudflare Worker (sync API + pkpass signing, checked with openssl).

on:
  push:
    branches: ["**"]
    paths: ["backend/**", ".github/workflows/test-backend.yml"]
  pull_request:
    paths: ["backend/**"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npx wrangler deploy --dry-run --outdir dist
