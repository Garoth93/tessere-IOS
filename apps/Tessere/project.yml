# XcodeGen spec. The .xcodeproj is generated in CI with `xcodegen generate`
# and is never committed.
#
name: Tessere

options:
  bundleIdPrefix: com.garoth93
  deploymentTarget:
    iOS: "26.0"   # iPhone dell'utente: iOS 26+; SDK del runner: iOS 26.5 (Xcode 26.6)
  xcodeVersion: "26.6"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  TessereCore:
    path: ../../packages/TessereCore

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1"          # iPhone only
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    # Signing is empty here on purpose:
    # - testflight.yml overrides it on the command line (Automatic, team from
    #   the APPLE_TEAM_ID secret, profiles via the App Store Connect API key);
    # - build-ipa.yml (Sideloadly fallback) builds with CODE_SIGNING_ALLOWED=NO
    #   and ad-hoc signs with the .entitlements files.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""
    PROVISIONING_PROFILE_SPECIFIER: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  Tessere:
    type: application
    platform: iOS
    # Tells Xcode's automatic signing which capabilities the App ID needs.
    attributes:
      SystemCapabilities:
        com.apple.ApplicationGroups.iOS:
          enabled: 1
    sources:
      - path: Sources
      - path: Shared
      - path: Resources
    dependencies:
      - package: TessereCore
        product: TessereCore
      - target: TessereWidgets
        embed: true
      - sdk: AVFoundation.framework
      - sdk: Vision.framework
      - sdk: PassKit.framework
      - sdk: LocalAuthentication.framework
      - sdk: CoreLocation.framework
      - sdk: MapKit.framework
      - sdk: UserNotifications.framework
      - sdk: SafariServices.framework
      - sdk: CoreImage.framework
      - sdk: PhotosUI.framework
      - sdk: WidgetKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.garoth93.tessere
        PRODUCT_NAME: Tessere
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Tessere.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: Info.plist   # generated by XcodeGen from the properties below (git-ignored)
      properties:
        CFBundleDisplayName: Tessere
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: it
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSupportsIndirectInputEvents: true
        UIUserInterfaceStyle: Automatic
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        NSCameraUsageDescription: "Tessere usa la fotocamera solo per leggere il codice a barre o QR delle tue carte e gli inviti della famiglia."
        NSPhotoLibraryUsageDescription: "Tessere apre solo l'immagine che scegli, per leggere un codice o usarla come logo."
        NSFaceIDUsageDescription: "Tessere può chiedere Face ID per mostrare le tue carte."
        NSLocationWhenInUseUsageDescription: "Tessere usa la posizione per suggerirti la carta giusta quando sei in un negozio e per cercare i negozi vicini delle tue carte."
        NSLocationAlwaysAndWhenInUseUsageDescription: "Con l'accesso «Sempre» Tessere può avvisarti quando entri in un negozio di cui hai la carta, anche ad app chiusa. La posizione non lascia il tuo iPhone."
        TSAppGroup: group.com.garoth93.tessere
        CFBundleURLTypes:
          - CFBundleURLName: com.garoth93.tessere
            CFBundleURLSchemes:
              - tessere

  TessereWidgets:
    type: app-extension
    platform: iOS
    attributes:
      SystemCapabilities:
        com.apple.ApplicationGroups.iOS:
          enabled: 1
    sources:
      - path: Widgets
      - path: Shared
    dependencies:
      - package: TessereCore
        product: TessereCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.garoth93.tessere.widgets
        PRODUCT_NAME: TessereWidgets
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Widgets.entitlements
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) WIDGET_EXTENSION"
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    info:
      path: Widgets-Info.plist   # generated by XcodeGen (git-ignored)
      properties:
        CFBundleDisplayName: Tessere
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: it
        TSAppGroup: group.com.garoth93.tessere
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

schemes:
  Tessere:
    build:
      targets:
        Tessere: all
        TessereWidgets: all
    run:
      config: Debug
    archive:
      config: Release
